name: Deploy backend to AWS

# Runs infra/aws-ec2/deploy.sh on the EC2 server through AWS Systems Manager.
# No SSH key or AWS access key is stored in GitHub: the job signs in with a
# short-lived OIDC token to the role Terraform created (infra/terraform), which
# may only send commands to this one server.
#
# Needs these repository VARIABLES (Settings -> Secrets and variables -> Actions
# -> Variables), printed by `terraform output github_actions_variables`:
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, AWS_INSTANCE_ID, PUBLIC_DOMAIN

on:
  push:
    branches: [iuc]
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'infra/aws-ec2/**'
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC sign-in to AWS
  contents: read

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped (not failed) until the repository variables are configured.
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
    steps:
      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run deploy.sh on the server
        run: |
          jq -n '{
            commands: ["sudo -u ubuntu -i bash -c \"cd ~/nexoraa-cleansoft && git pull --ff-only && bash infra/aws-ec2/remote-deploy.sh --no-pull\""],
            executionTimeout: ["3600"]
          }' > params.json

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub ${GITHUB_SHA::7} by ${GITHUB_ACTOR}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          # Builds take 15-25 minutes on a small server; poll every 20s.
          while true; do
            sleep 20
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "$(date -u +%H:%M:%S) $status"
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
          done

          echo "::group::Server output (last 200 lines)"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "::endgroup::"
          echo "::group::Server errors"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"

          [ "$status" = "Success" ] || { echo "::error::Deploy finished with status $status"; exit 1; }

      - name: Smoke test over HTTPS
        if: vars.PUBLIC_DOMAIN != ''
        run: |
          for url in \
            "https://auth.${{ vars.PUBLIC_DOMAIN }}/api/v1/health/live" \
            "https://admin.${{ vars.PUBLIC_DOMAIN }}/api/v1/tenant/subscription/plans"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 5 --retry-delay 10 --retry-all-errors "$url")
            echo "$code $url"
            # 200 = healthy; 401 = service up and correctly asking for a login.
            case "$code" in 200|401) ;; *) echo "::error::$url returned $code"; exit 1 ;; esac
          done
