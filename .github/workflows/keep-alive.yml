name: Keep-alive (Render free tier)

on:
  # Schedule removed: keeping every free Render service awake 24/7 exhausts the
  # workspace's 750 free instance-hours/month in ~2 days, after which Render
  # suspends ALL free services until the next month. Run manually if needed.
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            url: https://nexoraa-cleansoft-1.onrender.com/api/v1/health/live
          - name: platform-admin-service
            url: https://nexoraa-cleansoft-j8k6.onrender.com/api/v1/health
          - name: tenant-service
            url: https://tenant-service-f6dz.onrender.com/api/v1/health
    steps:
      - name: Ping ${{ matrix.service.name }}
        run: curl -sf --max-time 90 "${{ matrix.service.url }}"
