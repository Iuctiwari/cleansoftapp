name: nexoraa_mobile
description: Mobile App foundation without UI.
publish_to: none
version: 1.0.3+4

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  go_router: ^17.3.0
  http: ^1.6.0
  intl: any
  pdf: ^3.11.1
  printing: ^5.14.2
  socket_io_client: ^3.1.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
