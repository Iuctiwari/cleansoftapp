# =============================================================================
# docker-compose.yml — Nexoraa CleanSoft LOCAL DEVELOPMENT
#
# This file starts the infrastructure services (MongoDB + Redis) that backend
# services depend on.  Developers run the NestJS services locally via:
#
#   pnpm dev          # starts all services with hot-reload via Turborepo
#   pnpm --filter @nexoraa/auth-service dev   # starts the unified HTTP/auth service
#
# Start infrastructure only:
#   docker compose up -d
#
# Start infrastructure + unified auth service in Docker (optional):
#   docker compose --profile gateway up -d
#
# Start ALL backend services in Docker (optional):
#   docker compose --profile gateway --profile services up -d
# =============================================================================

name: nexoraa-cleansoft

# ─────────────────────────────────────────────────────────────────────────────
# Reusable anchors
# ─────────────────────────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '3'

x-service-build: &service-build
  context: .
  dockerfile: apps/backend/Dockerfile

x-backend-env: &backend-env
  NODE_ENV: development
  MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DATABASE:-nexoraa_dev}?replicaSet=rs0&directConnection=true
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: debug

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  nexoraa-internal:
    driver: bridge
    name: nexoraa-internal-dev

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes (persisted between container restarts)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  mongodb-data:
    name: nexoraa-mongodb-data-dev
  mongodb-config:
    name: nexoraa-mongodb-config-dev
  redis-data:
    name: nexoraa-redis-data-dev

# ─────────────────────────────────────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ───────────────────────────────────────────────────────────────────────────
  # MongoDB — Single-node replica set (required for Mongoose transactions
  # and change streams, even in local development)
  # ───────────────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: >
      mongod
        --replSet rs0
        --bind_ip_all
        --oplogSize 128
    ports:
      - '${MONGODB_PORT:-27017}:27017'
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - nexoraa-internal
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - mongosh
        - --eval
        - "db.adminCommand('ping').ok === 1 ? 0 : quit(1)"
        - --quiet
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ───────────────────────────────────────────────────────────────────────────
  # mongo-init — One-shot container that initialises the replica set.
  # Runs once, then exits. Docker marks it as "completed_successfully".
  # ───────────────────────────────────────────────────────────────────────────
  mongo-init:
    image: mongo:8.0
    restart: 'no'
    command: >
      bash -c "
        echo '[mongo-init] Waiting for MongoDB...' &&
        until mongosh --host mongodb:27017 --eval \"db.adminCommand('ping').ok\" --quiet 2>/dev/null | grep -q 1; do
          echo '[mongo-init] Not ready yet, sleeping 2s...' && sleep 2;
        done &&
        echo '[mongo-init] MongoDB ready. Checking replica set...' &&
        INITIALIZED=\$$(mongosh --host mongodb:27017 --eval \"try { rs.status().ok } catch(e) { 0 }\" --quiet 2>/dev/null | tail -1) &&
        if [ \"\$$INITIALIZED\" = '1' ]; then
          echo '[mongo-init] Replica set already initialised.';
        else
          echo '[mongo-init] Initialising replica set rs0...' &&
          mongosh --host mongodb:27017 --eval \"rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]})\" --quiet &&
          echo '[mongo-init] Done.';
        fi
      "
    networks:
      - nexoraa-internal
    depends_on:
      mongodb:
        condition: service_healthy
    logging: *default-logging

  # ───────────────────────────────────────────────────────────────────────────
  # Redis — Session store, BullMQ queue backend, cache layer
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:8.0-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.dev.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - nexoraa-internal
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ───────────────────────────────────────────────────────────────────────────
  # Unified Auth Service (profiles: gateway, services)
  # Optionally run the public authentication service in Docker for integration testing.
  # By default, start this locally with: pnpm --filter @nexoraa/auth-service dev
  # ───────────────────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────────────────
  # Auth Service
  # ───────────────────────────────────────────────────────────────────────────
  auth-service:
    profiles: [gateway, services]
    build:
      <<: *service-build
      args:
        SERVICE: auth-service
    restart: unless-stopped
    ports:
      - '${AUTH_SERVICE_HOST_PORT:-3000}:3000'
    environment:
      <<: *backend-env
      APP_NAME: Nexoraa CleanSoft
      PORT: 3000
      HOST: 0.0.0.0
      API_PREFIX: api
      API_VERSION: v1
      SERVICE_NAME: auth-service
    env_file:
      - path: ./apps/backend/auth-service/.env
        required: false
    networks:
      - nexoraa-internal
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/api/v1/health/live
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ───────────────────────────────────────────────────────────────────────────
  # Tenant Service (profile: services)
  # ───────────────────────────────────────────────────────────────────────────
  tenant-service:
    profiles: [services]
    build:
      <<: *service-build
      args:
        SERVICE: tenant-service
    restart: unless-stopped
    ports:
      - '3003:3000'
    environment:
      <<: *backend-env
      PORT: 3000
      SERVICE_NAME: tenant-service
    networks:
      - nexoraa-internal
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    logging: *default-logging

  # ───────────────────────────────────────────────────────────────────────────
  # Branch Service (profile: services)
