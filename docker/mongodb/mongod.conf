# =============================================================================
# docker/mongodb/mongod.conf — Production MongoDB Configuration
# Mounted by docker-compose.prod.yml at /etc/mongod.conf
# =============================================================================

# ─── System log ───────────────────────────────────────────────────────────────
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  verbosity: 0
  component:
    command:
      verbosity: 0

# ─── Storage ──────────────────────────────────────────────────────────────────
storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      # Keep cache at ~50% of container memory limit (adjust to match resource limits)
      cacheSizeGB: 0.5
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# ─── Network ──────────────────────────────────────────────────────────────────
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 512
  tls:
    mode: disabled   # Enable when TLS termination is done at the app layer

# ─── Security ─────────────────────────────────────────────────────────────────
security:
  authorization: enabled    # Enforce access control
  javascriptEnabled: false  # Disable server-side JS for security

# ─── Replica Set ──────────────────────────────────────────────────────────────
# Single-node replica set required for:
#   - Multi-document ACID transactions (Mongoose sessions)
#   - Change streams (event-driven patterns)
replication:
  replSetName: rs0
  oplogSizeMB: 512

# ─── Operation profiling ──────────────────────────────────────────────────────
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100

# ─── Process management ───────────────────────────────────────────────────────
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
