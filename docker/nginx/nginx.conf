# =============================================================================
# docker/nginx/nginx.conf — Nexoraa CleanSoft Reverse Proxy
# Handles external HTTP traffic and routes to the API Gateway container.
#
# In production:
#   - Uncomment the HTTPS server block and TLS directives
#   - Mount your certificates at /etc/nginx/certs/
#   - Set the DOMAIN env var in docker-compose.prod.yml
# =============================================================================

# ─── Worker settings ──────────────────────────────────────────────────────────
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ── Basic settings ─────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    charset utf-8;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;        # hide Nginx version from response headers

    keepalive_timeout  75s;
    keepalive_requests 1000;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"correlation_id":"$http_x_correlation_id",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log  warn;

    # ── Compression ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/javascript;

    # ── Rate limiting ──────────────────────────────────────────────────────────
    # 200 requests/minute per IP — adjust based on expected load
    limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=200r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ── Upstream: API Gateway ──────────────────────────────────────────────────
    upstream nexoraa_api_gateway {
        server api-gateway:3000;
        keepalive 64;                   # persistent upstream connections
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    # ── Security headers (shared across server blocks) ─────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP server ────────────────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ── Health check — bypass rate limiting for probe agents ───────────────
        location = /api/v1/health/live {
            access_log off;
            proxy_pass         http://nexoraa_api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /api/v1/health/ready {
            access_log off;
            proxy_pass         http://nexoraa_api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Swagger UI — no rate limiting (internal/dev tool) ──────────────────
        location /api/docs {
            proxy_pass         http://nexoraa_api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── All API routes ─────────────────────────────────────────────────────
        location /api/ {
            # Apply rate limiting
            limit_req  zone=api_per_ip burst=50 nodelay;
            limit_conn conn_per_ip 100;

            proxy_pass         http://nexoraa_api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Upgrade           $http_upgrade;

            # Timeouts
            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            # Buffering — disable for streaming/SSE endpoints
            proxy_buffering        on;
            proxy_buffer_size      4k;
            proxy_buffers          8 8k;

            # Security headers applied to all API responses
            add_header X-Content-Type-Options  nosniff            always;
            add_header X-Frame-Options         DENY               always;
            add_header X-XSS-Protection        "1; mode=block"    always;
            add_header Referrer-Policy         strict-origin      always;
            add_header Cache-Control           "no-store"         always;

            # Remove upstream server identification
            proxy_hide_header X-Powered-By;
        }

        # ── Default: reject unknown paths ─────────────────────────────────────
        location / {
            return 404 '{"error":{"code":"NOT_FOUND","category":"not_found","messageKey":"route.not_found","retryable":false}}';
            add_header Content-Type application/json always;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # HTTPS server block (uncomment in production after mounting TLS certs)
    # ═══════════════════════════════════════════════════════════════════════════
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name ${DOMAIN};
    #
    #     # TLS certificates (managed by Let's Encrypt / cert-manager externally)
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_trusted_certificate /etc/nginx/certs/chain.pem;
    #
    #     # Modern TLS — no SSLv3 / TLS 1.0 / TLS 1.1
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:MozSSL:10m;
    #     ssl_session_tickets off;
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #
    #     # HSTS (2 year)
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     # ... same location blocks as the HTTP server above
    # }
