# =============================================================================
# docker/redis/redis.conf — Production Redis Configuration
# Hardened settings for a production deployment.
# This file is bind-mounted by docker-compose.prod.yml.
# =============================================================================

# ─── Network ──────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
tcp-keepalive 60
timeout 300
tcp-backlog 511

# ─── Authentication ───────────────────────────────────────────────────────────
# Password MUST be overridden via the REDIS_PASSWORD env var at runtime.
# This placeholder forces an error if not set correctly.
requirepass CHANGE_ME_REDIS_PASSWORD

# ─── General ──────────────────────────────────────────────────────────────────
loglevel notice
databases 16
always-show-logo no
protected-mode yes

# ─── Memory management ────────────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5
activerehashing yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ─── Persistence — AOF (Append-Only File) ────────────────────────────────────
# AOF provides durability for session/queue data used by BullMQ.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec          # flush once per second (good balance)
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes      # hybrid format for fast restarts

# ─── Persistence — RDB snapshots ─────────────────────────────────────────────
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data
rdbcompression yes
rdbchecksum yes

# ─── Slow log ─────────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000  # 10ms
slowlog-max-len 128

# ─── Security: rename / disable dangerous commands ───────────────────────────
# Prevents accidental or malicious data destruction from application code.
rename-command FLUSHALL   ""
rename-command FLUSHDB    ""
rename-command DEBUG      ""
rename-command CONFIG     ""
rename-command SHUTDOWN   ""
rename-command SLAVEOF    ""
rename-command REPLICAOF  ""

# ─── Client limits ────────────────────────────────────────────────────────────
maxclients 512

# ─── Keyspace notifications (BullMQ uses these for delayed jobs) ──────────────
notify-keyspace-events "Ex"
