# =============================================================================
# docker/redis/redis.dev.conf — Development Redis Configuration
# Permissive settings suited for a local development environment.
# This file is bind-mounted by docker-compose.yml.
# =============================================================================

# ─── Network ──────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
tcp-keepalive 60
timeout 0

# ─── General ──────────────────────────────────────────────────────────────────
loglevel notice
databases 16
save 900 1
save 300 10
save 60 10000

# ─── No password in dev ───────────────────────────────────────────────────────
# requirepass is intentionally omitted for local development convenience

# ─── Memory ───────────────────────────────────────────────────────────────────
# No hard limit in dev; let the process use available RAM
maxmemory 0
maxmemory-policy noeviction

# ─── Persistence ──────────────────────────────────────────────────────────────
# AOF off in dev for faster restart
appendonly no
