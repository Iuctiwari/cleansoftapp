  # ---------------------------------------------------------------------------
  # tenant-service
  # IMPORTANT: unlike every other service here, tenant-service calls
  # configService.getOrThrow('MONGODB_URI') directly in app.module.ts — a
  # missing/blank value here crashes the process at boot (not just a broken
  # DB connection at request time like the other 13 services).
  # ---------------------------------------------------------------------------
  - type: web
    name: tenant-service
    runtime: node
    plan: free
    branch: iuc
    buildCommand: npm install -g corepack@latest && corepack pnpm install --frozen-lockfile && corepack pnpm turbo run build --filter=@nexoraa/tenant-service
    startCommand: corepack pnpm --filter @nexoraa/tenant-service start:prod
    envVars:
