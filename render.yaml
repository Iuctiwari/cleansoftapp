    buildCommand: npm install -g corepack@latest && corepack pnpm install --frozen-lockfile && corepack pnpm turbo run build --filter=@nexoraa/order-service
    startCommand: corepack pnpm --filter @nexoraa/order-service start:prod
    envVars:
