      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: user-service
      # Database name: nexoraa_user_prod
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SERVICE_BASE_URL
        value: https://nexoraa-cleansoft-1.onrender.com/api
      # REQUIRED — same auth-service URL as above, used for staff-provisioning calls.
      - key: AUTH_SERVICE_INTERNAL_URL
        value: https://nexoraa-cleansoft-1.onrender.com
      # REQUIRED — must be the EXACT same value as auth-service's own
      # INTERNAL_SERVICE_SECRET (staff-provisioning.controller.ts checks it).
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      - key: API_VERSION
        value: v1
      - key: API_PREFIX
        value: api
      - key: PLATFORM_ADMIN_INTERNAL_KEY
        sync: false

