        value: https://nexoraa-cleansoft-1.onrender.com/api
      # Sibling in THIS same batch — fill in with customer-service's Render URL
      # (…/api) once it's live.
      - key: CUSTOMER_SERVICE_BASE_URL
        sync: false
      # Sibling in THIS same batch — fill in with branch-service's Render URL once live.
      - key: BRANCH_SERVICE_BASE_URL
        sync: false
      # Sibling in THIS same batch — fill in with service-service's Render URL
      # (…/api/v1) once live.
      - key: SERVICE_SERVICE_BASE_URL
        sync: false
      # Sibling in THIS same batch — fill in with notification-service's Render URL once live.
      - key: NOTIFICATION_SERVICE_BASE_URL
        sync: false
      # Must be the EXACT same value as payment-service's own PAYMENT_PROJECTION_KEY —
      # authenticates payment-service's "apply payment to order" callback.
      - key: PAYMENT_PROJECTION_KEY
        sync: false
      - key: PLATFORM_ADMIN_INTERNAL_KEY
        sync: false

