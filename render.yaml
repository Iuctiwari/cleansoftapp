      - key: SERVICE_NAME
        value: tenant-service
      # Database name: nexoraa_tenant_prod — REQUIRED, boot fails without it.
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SERVICE_BASE_URL
        value: https://nexoraa-cleansoft-1.onrender.com/api
      # Sibling in THIS same batch — fill in with service-service's Render URL
      # (…/api) once live.
      - key: SERVICE_MANAGEMENT_BASE_URL
