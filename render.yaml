# =============================================================================
# Render Blueprint — remaining 14 backend services
#
# Does NOT include auth-service or platform-admin-service — both are already
# deployed manually and must not be touched by this Blueprint:
#   - auth-service            -> https://nexoraa-cleansoft-1.onrender.com
#   - platform-admin-service  -> https://nexoraa-cleansoft-j8k6.onrender.com
#
# Every `sync: false` value is a secret (or a not-yet-known sibling URL) that
# is intentionally left OUT of this file — fill it in via the Render
# dashboard after the Blueprint creates the service. See the deploy summary
# for exactly what to put in each one.
#
# Database-per-service convention: every MONGODB_URI below is its own
# database on the SAME Atlas cluster the first 2 services already use, only
# the database name in the URI path differs (see the comment above each one).
#
# ENFORCE_TENANT_GUARDS is deliberately NOT set anywhere in this file. Every
# guard that reads it defaults to "false" (disabled) when the variable is
# absent — leave it unset here. Do not add it as part of this deployment.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # branch-service
  # ---------------------------------------------------------------------------
  - type: web
    name: branch-service
    runtime: node
    plan: free
    branch: iuc
    buildCommand: npm install -g corepack@latest && corepack pnpm install --frozen-lockfile && corepack pnpm turbo run build --filter=@nexoraa/branch-service
    startCommand: corepack pnpm --filter @nexoraa/branch-service start:prod
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: branch-service
      # Database name: nexoraa_branch_prod (same Atlas cluster as the other services)
      - key: MONGODB_URI
        sync: false
      # Must be the EXACT same value as auth-service's own AUTH_ACCESS_TOKEN_SECRET —
      # branch-service verifies auth-service-issued JWTs locally with this, not
      # over HTTP like every other service here.
      - key: AUTH_ACCESS_TOKEN_SECRET
        sync: false
      # Must match platform-admin-service's own PLATFORM_ADMIN_INTERNAL_KEY —
      # authenticates platform-admin-service's internal branch-count lookups.
      - key: PLATFORM_ADMIN_INTERNAL_KEY
        sync: false
      - key: DEFAULT_BRANCH_LIMIT
        value: "3"

  # ---------------------------------------------------------------------------
  # customer-service
  # ---------------------------------------------------------------------------
  - type: web
    name: customer-service
    runtime: node
    plan: free
    branch: iuc
    buildCommand: npm install -g corepack@latest && corepack pnpm install --frozen-lockfile && corepack pnpm turbo run build --filter=@nexoraa/customer-service
    startCommand: corepack pnpm --filter @nexoraa/customer-service start:prod
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: customer-service
      # Database name: nexoraa_customer_prod
      - key: MONGODB_URI
        sync: false
      # Already-deployed auth-service's real URL — verifies incoming tenant/staff tokens.
      - key: AUTH_SERVICE_BASE_URL
        value: https://nexoraa-cleansoft-1.onrender.com/api
      # Must match platform-admin-service's own PLATFORM_ADMIN_INTERNAL_KEY.
      - key: PLATFORM_ADMIN_INTERNAL_KEY
        sync: false

