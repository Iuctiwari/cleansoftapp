      - key: PLATFORM_ADMIN_INTERNAL_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # user-service (staff accounts)
  # IMPORTANT: AUTH_SERVICE_INTERNAL_URL and INTERNAL_SERVICE_SECRET are read
  # via configService.getOrThrow — both are REQUIRED, boot fails without them
  # (only AUTH_SERVICE_BASE_URL, a separate variable used for a different
  # purpose — verifying incoming tokens — is soft/optional here).
  # ---------------------------------------------------------------------------
  - type: web
    name: user-service
    runtime: node
    plan: free
    branch: iuc
    buildCommand: npm install -g corepack@latest && corepack pnpm install --frozen-lockfile && corepack pnpm turbo run build --filter=@nexoraa/user-service
    startCommand: corepack pnpm --filter @nexoraa/user-service start:prod
    envVars:
      - key: NODE_VERSION
